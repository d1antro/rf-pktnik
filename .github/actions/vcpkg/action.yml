name: vcpkg
description: Fetch vcpkg at a pinned commit, point VCPKG_ROOT at it, and cache the packages it builds between runs.

inputs:
  commit:
    description: >-
      microsoft/vcpkg commit to use. The runner's preinstalled vcpkg moves with each image update and
      its newer ports can break the build, so keep this at the commit you build with locally.
    default: 890e0f0506f9dcb76800dfa2ea28b03ebc627bfa

runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $root = "${{ runner.temp }}\vcpkg"
        $cache = "${{ runner.temp }}\vcpkg-cache"
        git init -q $root
        git -C $root fetch -q --depth 1 https://github.com/microsoft/vcpkg.git ${{ inputs.commit }}
        git -C $root checkout -q FETCH_HEAD
        & "$root\bootstrap-vcpkg.bat" -disableMetrics
        New-Item -ItemType Directory -Force $cache | Out-Null
        "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
        "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV

    - uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}\vcpkg-cache
        key: vcpkg-${{ github.job }}-${{ inputs.commit }}-${{ hashFiles('vcpkg.json') }}
